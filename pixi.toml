[workspace]
name = "straditize"
version = "0.2.2"
description = "Installer for straditize and its dependencies"
authors = ["chmzs <chmzs@outlook.com>"]
channels = ["conda-forge"]
platforms = ["win-64"]
preview = ["pixi-build"]          # 启用预览特性，支持本地路径构建

[pypi-options]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
extra-index-urls = ["https://pypi.org/simple"]

[tasks]
run-straditize = "python -m straditize"   # 启动应用
desktop = "python -m straditize_core.rpc_server"                            # 启动桌面模式 (自动端口/调起浏览器/退出按钮)
rpc-server = "python -m straditize_core.rpc_server serve --port 8765"       # 启动服务器模式 (127.0.0.1:8765 / 无退出按钮)
frontend-dev = "pnpm --prefix frontend run dev"                         # 启动现代版前端开发服务器

[tasks.test]
description = "Run modern Straditize Pro test suite"
cmd = "python -m pytest tests/test_core.py tests/test_rpc.py tests/verify_straditize_pro_e2e.py tests/test_age_depth_model.py tests/test_metadata_and_lipd.py -q"

[tasks.test-legacy]
description = "Run legacy PyQt5 widget test suite (requires legacy dependencies)"
cmd = "python -m pytest straditize/tests/widgets -q"

[tasks.install]
description = "Install straditize in editable mode"
cmd = "python -m pip install -e . --no-build-isolation"

[tasks.lint]
description = "Run lint checks"
cmd = "ruff check straditize_core tests"

[tasks.format]
description = "Format Python code"
cmd = "ruff format straditize_core tests"

[tasks.build-windows]
description = "Build Windows distribution bundle"
cmd = "pyinstaller straditize/support/straditize_windows_pyinst.spec --distpath straditize/support/dist --workpath straditize/support/build --noconfirm"

[dependencies]
# 仅 Python、pip 走 conda；运行时和开发依赖优先使用 PyPI wheel，减少环境体积
python = ">=3.12,<3.13"
pip = "*"

[pypi-dependencies]
# ===== 核心科学计算运行时依赖 (纯无 GUI 现代化算力栈) =====
numpy = ">=1.26,<3.0"
scipy = ">=1.14,<2.0"
pandas = ">=2.3,<3.0"
scikit-image = ">=0.23,<1.0"
pillow = ">=10,<12"
openpyxl = ">=3.1,<4.0"
pypdf = ">=4.0,<6.0"

# ===== 开发/测试/独立分发打包依赖 =====
setuptools = ">=70,<81"
pytest = ">=9.0.2,<10"
ruff = ">=0.11,<1"
pyinstaller = ">=6.0,<7"

# 本地源码包以 editable 方式安装
straditize-pro = { path = "./", editable = true }
