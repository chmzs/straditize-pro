[workspace]
name = "straditize"
version = "0.2.2"
description = "Installer for straditize and its dependencies"
authors = ["chmzs <chmzs@outlook.com>"]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-arm64"]
preview = ["pixi-build"]          # 启用预览特性，支持本地路径构建

[pypi-options]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
extra-index-urls = ["https://pypi.org/simple"]

[tasks]
app = "python -m straditize_core.rpc_server"                                   # 启动现代版应用 (浏览器 + JSON-RPC + WebMCP + 退出)
frontend-dev = "npm --prefix frontend run dev"                            # 启动现代版前端开发服务器

[tasks.test]
description = "Run the FULL backend test suite (was: a hand-picked 16-file whitelist)"
cmd = "python -m pytest --ignore=tests/e2e -q"
# 已知失败用例由 tests/quarantine.txt 标记为 strict xfail，不再靠文件白名单隐藏；
# 用例一旦修好会以 XPASS 让本任务变红，强制把条目从隔离区删除。新增测试文件无需改这里。

[tasks.test-e2e]
description = "Run ALL Playwright end-to-end browser tests (was: test_smoke.py only, 1 of 10)"
cmd = "python -m pytest tests/e2e -q"
# 原先只跑 tests/e2e/test_smoke.py —— 9 条 E2E 里 8 条从未被任何门禁执行，
# golden_journey 的 base64 与 naming 的列 id 两处回归就是这样漏掉的。

[tasks.test-legacy]
description = "Run legacy PyQt5 widget test suite (requires legacy dependencies)"
cmd = "python -m pytest straditize/tests/widgets -q"

[tasks.install]
description = "Install straditize in editable mode"
cmd = "python -m pip install -e . --no-build-isolation"

[tasks.lint]
description = "Run lint checks"
cmd = "ruff check straditize_core tests"

[tasks.format]
description = "Format Python code"
cmd = "ruff format straditize_core tests"

[tasks.build]
description = "Build standalone distribution bundle for current platform"
cmd = "pyinstaller support/straditize_pro.spec --distpath dist --workpath build --noconfirm"

[tasks.build-windows]
description = "Build Windows distribution bundle"
cmd = "pyinstaller support/straditize_pro.spec --distpath dist --workpath build --noconfirm"

[dependencies]
# 仅 Python、pip 走 conda；运行时和开发依赖优先使用 PyPI wheel，减少环境体积
python = ">=3.12,<3.13"
pip = "*"

[pypi-dependencies]
# ===== 核心科学计算运行时依赖 (纯无 GUI 现代化算力栈) =====
numpy = ">=1.26,<3.0"
scipy = ">=1.14,<2.0"
pandas = ">=3.0,<4.0"
scikit-image = ">=0.23,<1.0"
pillow = ">=10,<12"
openpyxl = ">=3.1,<4.0"
pypdf = ">=4.0,<6.0"
onnxruntime = ">=1.17,<2.0"
requests = ">=2.28,<3.0"

# ===== 开发/测试/独立分发打包依赖 =====
setuptools = ">=70"
pytest = ">=9.0.2,<10"
ruff = ">=0.11,<1"
pyinstaller = ">=6.0,<7"

# 本地源码包以 editable 方式安装
straditize-pro = { path = "./", editable = true }
