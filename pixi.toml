[workspace]
name = "straditize"
version = "0.2.2"
description = "Installer for straditize and its dependencies"
authors = ["chmzs <chmzs@outlook.com>", "Philipp S. Sommer <philipp.sommer@unil.ch>"]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-arm64"]
preview = ["pixi-build"]          # 启用预览特性，支持本地路径构建

[pypi-options]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
extra-index-urls = ["https://pypi.org/simple"]

[tasks]
app = "python -m straditize_core.rpc_server"                                   # 启动现代版应用 (浏览器 + JSON-RPC + WebMCP + 退出)
frontend-dev = "npm --prefix frontend run dev"                            # 启动现代版前端开发服务器
record-tutorials = "python scripts/record_tutorials.py"                   # 自动录制 8 步工作流与三大模态框真机动图与视频

[tasks.test]
description = "Run the FULL backend test suite (was: a hand-picked 16-file whitelist)"
cmd = "python -m pytest -q"
# 已知失败用例由 tests/quarantine.txt 标记为 strict xfail，不再靠文件白名单隐藏；
# 用例一旦修好会以 XPASS 让本任务变红，强制把条目从隔离区删除。新增测试文件无需改这里。
# 原命令带 `--ignore=tests/e2e`；e2e 已整体迁到 Playwright（见 test-e2e），该目录已不存在。

[tasks.test-e2e]
description = "Build the SPA, then run ALL Playwright end-to-end browser tests (real Edge via channel=msedge)"
# 必须先 build：后端是通过 `find_frontend_dist()` 从 `frontend/dist` 托管 SPA 的
# （`straditize_core/rpc_server.py:686`，按 cwd/frontend/dist 解析），而 playwright 的
# webServer cwd 就是仓库根。若跳过这一步，e2e 会对着**上一次构建的旧产物**跑：改了
# `frontend/src` 却只跑 test-e2e，用例照样全绿——那等于没测真实代码。build 本身含
# `tsc` 类型检查，代价约 2s，换取"测的就是当前源码"。
cmd = "npm --prefix frontend run build && npm --prefix frontend run test:e2e"
# 迁移自 12 个 pytest 文件（1451 行）：旧套件的会话是 session 级共享的，
# 测试间互相污染，全量跑 4 failed / 10 passed，单跑却通过；且其中多条断言
# 恒为真（读错真值文件路径、读错层名词汇表、用 snake_case 读 camelCase 键）。
# Playwright 版每条用例前经 `e2e.reset` 复位，并由启动器断言复位后状态确实干净。
# 依赖：Node ≥ 20 + 系统已装 Edge；后端由 playwright.config.ts 的 webServer 拉起。
# 端口默认 8799。本仓库多会话并发，若该端口已被**另一个会话的 e2e 后端**占用，
# 本次运行会立刻失败并指名占用者（`reuseExistingServer: false`）——这是有意的：
# 共用同一份后端会话会让两边的 `e2e.reset` 交错，产生"ROI 'pollen' 已存在""连接
# 已断开"这类与代码无关的随机红。并发跑第二份请显式错开端口：
#     STRADITIZE_E2E_PORT=22600 pixi run test-e2e
# 产物目录随之变为 `frontend/test-results-22600/`，两个会话不会互写 trace。

[tasks.test-contract]
description = "只跑前后端契约 lane（构建 SPA + e2e/contract.spec.ts），用于契约变更后的快速反馈"
# 契约破坏是本仓库已知最高危的失效类型（历史事故：前端发 `x_bounds` 而后端要
# `data_xlim`，被静默兜底掩盖很久）。全量 test-e2e 实测 95s，本 lane 只跑 5 条契约
# 用例、实测 26s，把"后端改了返回字段名"的反馈从分钟级压到半分钟级。语义与
# test-e2e 完全一致（同样先 build，避免对着旧的 frontend/dist 跑），且同样受
# fixtures.ts 的全局错误门禁约束。改 RPC 契约时先跑这个，再跑全量。
cmd = "npm --prefix frontend run build && npm --prefix frontend run test:e2e:contract"

[tasks.install]
description = "Install straditize in editable mode"
cmd = "python -m pip install -e . --no-build-isolation"

[tasks.lint]
description = "Run lint checks (ruff + 跨文件一致性核对)"
depends-on = ["lint-ruff", "lint-consistency"]

[tasks.lint-ruff]
description = "Run ruff checks"
cmd = "ruff check straditize_core tests"

[tasks.lint-consistency]
description = "核对跨文件必须一致的两端：签名/类型标注/package-data/测试收集/阶段编号/注释编号"
cmd = "python -X utf8 support/consistency_check.py"

[tasks.format]
description = "Format Python code"
cmd = "ruff format straditize_core tests"

[tasks.build]
description = "Build standalone distribution bundle for current platform"
cmd = "pyinstaller support/straditize_pro.spec --distpath dist --workpath build --noconfirm"

[tasks.build-windows]
description = "Build Windows distribution bundle"
cmd = "pyinstaller support/straditize_pro.spec --distpath dist --workpath build --noconfirm"

[tasks.build-installer]
description = "Build Windows Setup executable installer (.exe) via NSIS"
cmd = "makensis support/installer.nsi"

[dependencies]
# 仅 Python、pip 走 conda；运行时和开发依赖优先使用 PyPI wheel，减少环境体积
python = ">=3.12,<3.13"
pip = "*"

[pypi-dependencies]
# ===== 核心科学计算运行时依赖 (纯无 GUI 现代化算力栈) =====
numpy = ">=1.26,<3.0"
scipy = ">=1.14,<2.0"
pandas = ">=3.0,<4.0"
scikit-image = ">=0.23,<1.0"
pillow = ">=10,<12"
openpyxl = ">=3.1,<4.0"
pypdf = ">=4.0,<6.0"
onnxruntime = ">=1.17,<2.0"
requests = ">=2.28,<3.0"

# ===== 开发/测试/独立分发打包依赖 =====
setuptools = ">=70"
pytest = ">=9.0.2,<10"
ruff = ">=0.11,<1"
pyinstaller = ">=6.0,<7"

# 本地源码包以 editable 方式安装
straditize-pro = { path = "./", editable = true }
