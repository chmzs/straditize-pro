name: CI Quality Gate

on:
  push:
    branches:
      - main
      - dev-v2-modern
  pull_request:
    branches:
      - main
      - dev-v2-modern

jobs:
  test:
    name: Full Pipeline (Frontend & Python)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Frontend Assets
        working-directory: frontend
        run: |
          npm install
          npm run build

      # 前端自检此前完全不在 CI 内（只有 build），复刻实现的假测试因此长期无人复核
      - name: Run Frontend Tests
        working-directory: frontend
        run: npm test

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.8.3
        with:
          pixi-version: v0.71.1
          cache: true

      - name: Run Ruff Lint
        run: pixi run lint

      - name: Run Full Test Suite
        run: pixi run test
