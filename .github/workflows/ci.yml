name: CI Quality Gate

on:
  push:
    branches:
      - main
      - dev-v2-modern
  pull_request:
    branches:
      - main
      - dev-v2-modern

jobs:
  test:
    name: Python Lint & Tests
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.8.3
        with:
          pixi-version: v0.71.1
          cache: true

      - name: Run Ruff Lint
        run: pixi run lint

      - name: Run Full Test Suite
        run: pixi run test
