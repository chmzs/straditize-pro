name: Cross-Platform Build & Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release Version Tag (e.g. v2.0.0)"
        required: false
        default: "v2.0.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ==========================================================================
  # 1. Windows x64 Build
  # ==========================================================================
  build-windows:
    name: Windows x64 Build (.zip)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Frontend SPA
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.8.3
        with:
          pixi-version: v0.71.1
          cache: true

      - name: Build Standalone Executable
        run: pixi run build

      - name: Package Windows Zip
        shell: pwsh
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "${{ github.event.inputs.release_tag }}" }
          if (-not $tag) { $tag = "v2.0.0" }
          $zipName = "straditize-$tag-windows-x64.zip"
          Compress-Archive -Path "dist/straditize/*" -DestinationPath $zipName -Force
          echo "ASSET_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-bundle
          path: straditize-*-windows-x64.zip

  # ==========================================================================
  # 2. Linux x64 Build (.deb, .rpm, .tar.gz)
  # ==========================================================================
  build-linux:
    name: Linux x64 Build (.deb, .rpm, .tar.gz)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Frontend SPA
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.8.3
        with:
          pixi-version: v0.71.1
          cache: true

      - name: Install FPM Packaging Tools & RPM
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rubygems build-essential rpm
          sudo gem install --no-document fpm

      - name: Build Standalone Binary via PyInstaller
        run: pixi run build

      - name: Package Linux Distributions (.deb, .rpm, .tar.gz)
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.ref_type }}" != "tag" ] || [ -z "$TAG" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          fi
          if [ -z "$TAG" ]; then
            TAG="v2.0.0"
          fi
          RAW_VER=$(echo $TAG | sed 's/^v//')

          # 1. Create directory structure for native packages
          mkdir -p pkg_root/opt/straditize
          mkdir -p pkg_root/usr/local/bin
          mkdir -p pkg_root/usr/share/applications
          mkdir -p pkg_root/usr/share/icons/hicolor/scalable/apps

          # Copy binaries and assets
          cp -r dist/straditize/* pkg_root/opt/straditize/
          ln -s /opt/straditize/straditize pkg_root/usr/local/bin/straditize
          cp support/linux/straditize.desktop pkg_root/usr/share/applications/
          cp assets/logos/logo-icon.svg pkg_root/usr/share/icons/hicolor/scalable/apps/straditize.svg

          # 2. Build Debian/Ubuntu (.deb)
          fpm -s dir -t deb \
            -n straditize \
            -v "$RAW_VER" \
            --architecture amd64 \
            --maintainer "chmzs <chmzs@outlook.com>" \
            --description "Next-Generation Geological and Stratigraphic Diagram Digitizer" \
            --url "https://github.com/chmzs/straditize-pro" \
            --license "GPL-3.0-or-later" \
            -C pkg_root \
            -p "straditize_${RAW_VER}_amd64.deb" .

          # 3. Build RedHat/Fedora/CentOS (.rpm)
          fpm -s dir -t rpm \
            -n straditize \
            -v "$RAW_VER" \
            --architecture x86_64 \
            --maintainer "chmzs <chmzs@outlook.com>" \
            --description "Next-Generation Geological and Stratigraphic Diagram Digitizer" \
            --url "https://github.com/chmzs/straditize-pro" \
            --license "GPL-3.0-or-later" \
            -C pkg_root \
            -p "straditize-${RAW_VER}-1.x86_64.rpm" .

          # 4. Build Standalone Portable Archive (.tar.gz)
          tar -czvf "straditize-${TAG}-linux-x64.tar.gz" -C dist straditize

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-packages
          path: |
            *.deb
            *.rpm
            straditize-*-linux-x64.tar.gz

  # ==========================================================================
  # 3. macOS ARM64 Build (.tar.gz)
  # ==========================================================================
  build-macos:
    name: macOS Apple Silicon Build (.tar.gz)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Frontend SPA
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.8.3
        with:
          pixi-version: v0.71.1
          cache: true

      - name: Build Standalone Binary via PyInstaller
        run: pixi run build

      - name: Package macOS Tarball
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.ref_type }}" != "tag" ] || [ -z "$TAG" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          fi
          if [ -z "$TAG" ]; then
            TAG="v2.0.0"
          fi
          tar -czvf "straditize-${TAG}-macos-arm64.tar.gz" -C dist straditize

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-bundle
          path: straditize-*-macos-arm64.tar.gz

  # ==========================================================================
  # 4. Release Publisher (Triggers only on tag push or manual workflow dispatch)
  # ==========================================================================
  publish-release:
    name: Publish GitHub Release Assets
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download All Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Display Release Files
        run: ls -lh release_assets/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.release_tag }}
          name: "Straditize Pro ${{ github.ref_name || github.event.inputs.release_tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
